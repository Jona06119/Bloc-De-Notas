<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar</title>
    <link rel="stylesheet" href="css/inicio.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <form class="agregar-form" id="formulario-add">
        <div>
            <i class="bi bi-journal-bookmark"></i>
        </div>
        <h1>Notas Nuevas/Editar</h1>

        <input type="text" id="titulo" placeholder="titulo" required>
        <input type="text" id="descripcion" placeholder="descripcion" required>

        <div class="contenedor">
            <input type="date" id="fecha" placeholder="Fecha" required style="width:90px; height:20px;">
            <h3>Color:</h3>
            <input type="color" id="color" placeholder="Color" required style="width:60px; height:30px;">
        </div>

        <button type="button" onclick="window.location.href='buscar.html'">Cancelar</button>
        <button type="submit">Guardar</button>
    </form>

    <script src="js/agregar.js"></script>
</body>

</html>
